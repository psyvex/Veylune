[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/geometry",
    "crates/reconstruction",
    "crates/runtime",
]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
